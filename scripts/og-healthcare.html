<!doctype html>
<!--
  Source of public/og-healthcare.png (1200x630). To regenerate, from the repo root:
  chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=public/og-healthcare.png file:///<absolute path>/scripts/og-healthcare.html
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Instrument Serif';
        src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Inter Variable';
        font-weight: 100 900;
        src: url(../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2-variations');
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        font-weight: 100 800;
        src: url(../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2) format('woff2-variations');
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0e14; }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #e6eaf2;
        font-family: 'Inter Variable', sans-serif;
        background:
          radial-gradient(ellipse 620px 420px at 82% 8%, rgba(45, 212, 191, 0.18), transparent 70%),
          linear-gradient(#1f2937 1px, transparent 1px) 0 0 / 56px 56px,
          linear-gradient(90deg, #1f2937 1px, transparent 1px) 0 0 / 56px 56px,
          #0a0e14;
      }
      .card::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 100%, #0a0e14 35%, transparent 80%); }
      .card > * { position: relative; z-index: 1; }
      .eyebrow { font: 500 22px 'JetBrains Mono Variable', monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #2dd4bf; }
      .name { font: 400 132px/1 'Instrument Serif', serif; letter-spacing: -0.01em; }
      .tagline { margin-top: 28px; font-size: 36px; line-height: 1.35; color: #8b97ab; max-width: 880px; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="eyebrow">Case study · Java backend</p>
      <div>
        <h1 class="name" style="font-size:104px;line-height:1.02">Multi-clinic healthcare platform</h1>
        <p class="tagline">Three role-based portals, one Spring Boot API. By Rohit Raman, Java Backend Developer.</p>
      </div>
    </div>
  </body>
</html>
