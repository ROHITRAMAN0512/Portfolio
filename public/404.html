<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E14" />

        place-items: center;

        color: #e6eaf2;

        line-height: 1.6;
      }
      main { max-width: 32rem; }
      p.eyebrow { margin: 0 0 0.75rem; font: 0.75rem ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #2dd4bf; }
      h1 { margin: 0; font: 400 2.75rem/1.1 Georgia, "Times New Roman", serif; }

        color: #0a0e14;
        font-size: 0.875rem;

        text-decoration: none;
      }
      a.button:focus-visible { outline: 2px solid #2dd4bf; outline-offset: 3px; }

  <body>
    <main>
      <p class="eyebrow">404</p>
